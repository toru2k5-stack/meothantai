<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mèo Thần Tài 98 – Huế</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#c8922a; --gold-light:#f0c96b; --gold-pale:#fdf3dc;
    --red:#c0392b; --red-dark:#922b21;
    --ink:#1a0f00; --cream:#fdf8f0; --warm-gray:#8b7355; --border:#e8d5a3;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Nunito',sans-serif; color:var(--ink); overflow-x:hidden; }

  /* HEADER */
  header { background:linear-gradient(135deg,var(--red-dark),var(--red)); position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(192,57,43,0.4); }
  .header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:10px 16px; }
  .logo { display:flex; align-items:center; gap:8px; text-decoration:none; }
  .logo-icon { font-size:1.6rem; animation:sway 3s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  .logo-text .main { font-family:'Playfair Display',serif; font-size:1.1rem; color:var(--gold-light); font-weight:700; line-height:1.2; }
  .logo-text .sub { font-size:0.6rem; color:rgba(255,255,255,0.6); letter-spacing:1.5px; text-transform:uppercase; }
  .hotline { color:var(--gold-light); font-size:0.9rem; font-weight:700; text-decoration:none; text-align:right; }
  .hotline span { display:block; font-size:0.6rem; color:rgba(255,255,255,0.6); font-weight:400; }

  /* BANNER */
  .banner { width:100%; overflow:hidden; }
  .banner img { width:100%; max-height:280px; object-fit:cover; }

  /* CONTROLS */
  .controls-wrap { background:white; border-bottom:2px solid var(--border); }
  .controls { max-width:1200px; margin:0 auto; padding:10px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .search-box { flex:1; min-width:140px; display:flex; align-items:center; gap:6px; background:var(--cream); border:1.5px solid var(--border); border-radius:20px; padding:7px 12px; }
  .search-box input { border:none; background:none; outline:none; font-family:'Nunito',sans-serif; font-size:0.85rem; color:var(--ink); width:100%; }
  .filter-scroll { display:flex; gap:6px; overflow-x:auto; width:100%; padding-bottom:2px; scrollbar-width:none; }
  .filter-scroll::-webkit-scrollbar { display:none; }
  .filter-btn { padding:6px 14px; border-radius:20px; border:1.5px solid var(--border); background:white; font-family:'Nunito',sans-serif; font-size:0.78rem; font-weight:500; color:var(--warm-gray); cursor:pointer; transition:all 0.2s; white-space:nowrap; flex-shrink:0; }
  .filter-btn.active { background:var(--red); border-color:var(--red); color:white; font-weight:600; }
  .controls-row2 { display:flex; align-items:center; gap:8px; width:100%; }
  .price-filter select { padding:6px 10px; border-radius:20px; border:1.5px solid var(--border); font-family:'Nunito',sans-serif; font-size:0.78rem; color:var(--ink); background:white; outline:none; cursor:pointer; }
  .result-count { margin-left:auto; font-size:0.78rem; color:var(--warm-gray); font-weight:500; white-space:nowrap; }

  /* LOADING */
  .loading { text-align:center; padding:60px 20px; color:var(--warm-gray); }
  .loading .spin { font-size:2.5rem; animation:spin 1s linear infinite; display:inline-block; margin-bottom:12px; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* CATALOG */
  .catalog { max-width:1200px; margin:0 auto; padding:20px 12px 60px; }
  .section-title { display:flex; align-items:center; gap:10px; font-family:'Playfair Display',serif; font-size:1.2rem; color:var(--ink); margin-bottom:14px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  /* TABS */
  .tab-section { margin-bottom:32px; }
  .tab-header { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
  .tab-header::-webkit-scrollbar { display:none; }
  .tab-btn {
    padding:9px 18px; border:none; background:none; font-family:'Nunito',sans-serif;
    font-size:0.82rem; font-weight:600; color:var(--warm-gray); cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap;
    transition:all 0.2s;
  }
  .tab-btn.active { color:var(--red); border-bottom-color:var(--red); }
  .tab-content { display:none; }
  .tab-content.active { display:block; }

  /* GRID */
  .products-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:560px) { .products-grid { grid-template-columns:repeat(3,1fr); gap:14px; } }
  @media(min-width:860px) { .products-grid { grid-template-columns:repeat(4,1fr); gap:18px; } }

  /* CARD */
  .card { background:white; border-radius:12px; overflow:hidden; border:1.5px solid var(--border); transition:transform 0.25s,box-shadow 0.25s; position:relative; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 28px rgba(192,57,43,0.15); }
  .card.out-of-stock { opacity:0.6; }

  /* CARD IMAGE */
  .card-img-wrap { position:relative; overflow:hidden; background:var(--gold-pale); }
  .slides-track { display:flex; transition:transform 0.35s ease; }
  .slide { min-width:100%; }
  .slide img { width:100%; height:170px; object-fit:cover; display:block; }
  .slide-placeholder { width:100%; height:170px; background:linear-gradient(135deg,var(--gold-pale),#faebd7); display:flex; align-items:center; justify-content:center; font-size:3.5rem; }
  @media(min-width:560px) { .slide img,.slide-placeholder { height:190px; } }
  .slider-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.3); color:white; border:none; width:26px; height:26px; border-radius:50%; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:3; }
  .slider-btn.prev { left:5px; }
  .slider-btn.next { right:5px; }
  .slider-dots { position:absolute; bottom:5px; left:50%; transform:translateX(-50%); display:flex; gap:4px; }
  .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.5); }
  .dot.active { background:white; }

  /* BADGES */
  .card-badge-wrap { position:absolute; top:7px; left:7px; z-index:2; display:flex; flex-direction:column; gap:4px; }
  .badge { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:20px; font-size:0.62rem; font-weight:700; }
  .badge-cat { background:var(--red); color:white; }
  .badge-hot { background:var(--gold); color:white; }
  .badge-new { background:#27ae60; color:white; }
  .badge-soldout { background:#7f8c8d; color:white; }
  .badge-kieu { background:#8e44ad; color:white; }
  /* ✅ MỚI: Badge HOAT_DONG màu xanh dương */
  .badge-hoatdong { background:#2980b9; color:white; }

  /* CARD BODY */
  .card-body { padding:8px 10px 0; flex:1; }
  .card-name { font-family:'Playfair Display',serif; font-size:0.88rem; font-weight:700; color:var(--ink); margin-bottom:2px; line-height:1.3; }
  .card-size { font-size:0.68rem; color:var(--warm-gray); margin-bottom:3px; }
  .card-masp { font-size:0.65rem; color:#999; }

  /* CARD FOOTER */
  .card-footer { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:var(--gold-pale); border-top:1px solid var(--border); margin-top:8px; }
  .card-price { font-family:'Playfair Display',serif; font-size:0.95rem; font-weight:700; color:var(--red); }
  .card-price .unit { font-size:0.62rem; font-weight:400; color:var(--warm-gray); }
  .stock-info { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .stock-count { font-size:0.68rem; font-weight:700; }
  .stock-count.plenty { color:#27ae60; }
  .stock-count.low { color:#e67e22; }
  .stock-count.out { color:#e74c3c; }

  /* BUTTONS */
  .btn-wrap { padding:7px 10px 10px; display:flex; flex-direction:column; gap:5px; }
  .btn-copy { background:var(--red); color:white; border:none; border-radius:8px; padding:8px; font-family:'Nunito',sans-serif; font-size:0.76rem; font-weight:600; cursor:pointer; transition:background 0.2s; width:100%; }
  .btn-copy:hover { background:var(--red-dark); }
  .btn-zalo { background:#0068ff; color:white; border:none; border-radius:8px; padding:7px; font-family:'Nunito',sans-serif; font-size:0.74rem; font-weight:600; cursor:pointer; text-decoration:none; display:block; text-align:center; transition:background 0.2s; }
  .btn-zalo:hover { background:#0052cc; }
  .card.out-of-stock .btn-copy { background:#aaa; pointer-events:none; }
  .card.out-of-stock .btn-zalo { background:#bbb; pointer-events:none; }

  /* TOAST */
  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(60px); background:#222; color:white; padding:10px 22px; border-radius:24px; font-size:0.85rem; font-weight:500; z-index:9999; transition:transform 0.3s,opacity 0.3s; opacity:0; pointer-events:none; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  /* NO RESULTS */
  .no-results { text-align:center; padding:60px 24px; color:var(--warm-gray); display:none; }

  /* FOOTER */
  footer { background:var(--ink); color:rgba(255,255,255,0.7); padding:28px 20px; text-align:center; }
  footer .footer-cat { font-size:1.8rem; animation:sway 2s ease-in-out infinite; display:inline-block; margin-bottom:8px; }
  footer h3 { font-family:'Playfair Display',serif; color:var(--gold-light); font-size:1rem; margin-bottom:8px; }
  footer p { font-size:0.8rem; line-height:1.8; }
  footer a { color:var(--gold-light); text-decoration:none; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a href="#" class="logo">
      <span class="logo-icon">🐱</span>
      <div class="logo-text">
        <div class="main">Mèo Thần Tài 98</div>
        <div class="sub">Huế · Gốm sứ cao cấp</div>
      </div>
    </a>
    <a href="tel:0978725528" class="hotline">
      <span>Hotline</span>0978 725 528
    </a>
  </div>
</header>

<!-- BANNER -->
<div class="banner">
  <img id="banner-img" src="https://toru2k5-stack.github.io/meothantai/banner.jpg" alt="Banner"
    onerror="this.style.display='none'">
</div>

<!-- CONTROLS -->
<div class="controls-wrap">
  <div class="controls">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm sản phẩm, mã SP..." oninput="renderAll()">
    </div>
    <div class="filter-scroll">
      <button class="filter-btn active" onclick="setCategory('all',this)">Tất cả</button>
      <button class="filter-btn" onclick="setCategory('Mèo 1XX',this)">Mèo 1XX</button>
      <button class="filter-btn" onclick="setCategory('Mèo 2XX',this)">Mèo 2XX</button>
      <button class="filter-btn" onclick="setCategory('Mèo 3XX-4XX',this)">Mèo 3-4XX</button>
      <button class="filter-btn" onclick="setCategory('Mèo 5XX',this)">Mèo 5XX</button>
      <button class="filter-btn" onclick="setCategory('Trên 6XX',this)">Trên 6XX</button>
      <button class="filter-btn" onclick="setCategory('Kệ Đèn',this)">Kệ Đèn</button>
      <button class="filter-btn" onclick="setCategory('Box Mica',this)">Box Mica</button>
      <button class="filter-btn" onclick="setCategory('Lẵng',this)">Lẵng</button>
      <button class="filter-btn" onclick="setCategory('Phụ Kiện',this)">Phụ Kiện</button>
    </div>
    <div class="controls-row2">
      <div class="price-filter">
        <select id="priceFilter" onchange="renderAll()">
          <option value="all">💰 Tất cả giá</option>
          <option value="0-200000">Dưới 200k</option>
          <option value="200000-300000">200k – 300k</option>
          <option value="300000-500000">300k – 500k</option>
          <option value="500000-700000">500k – 700k</option>
          <option value="700000-1000000">700k – 1 triệu</option>
          <option value="1000000-99999999">Trên 1 triệu</option>
        </select>
      </div>
      <div class="result-count" id="resultCount">Đang tải...</div>
    </div>
  </div>
</div>

<!-- CATALOG -->
<div class="catalog" id="catalog">
  <div class="loading">
    <div class="spin">🐱</div>
    <div>Đang tải sản phẩm...</div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-cat">🐱</div>
  <h3>Shop Mèo Thần Tài 98</h3>
  <p>
    📍 129 Thạch Hãn – P.Thuận Hòa – Q.Phú Xuân – TP. Huế<br>
    📞 <a href="tel:0978725528">0978 725 528</a> &nbsp;|&nbsp;
    💬 Zalo: <a href="tel:0358014085">0358 014 085</a><br>
    <em>"Nghệ thuật của sự tinh tế – Tạo dấu ấn từ món quà ý nghĩa"</em>
  </p>
</footer>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSF-nJnA8Tg34qv8ocnHw81RX42qz1bguALq3kc7P1qAFYyPCN0zJM6L-gYWKGjtyPhcbdCiEadk7w/pub?gid=757565459&single=true&output=csv";
const IMG_BASE = "https://toru2k5-stack.github.io/meothantai/";

const TAB_CATEGORIES = {
  "Box Mica": ["Tất cả", "Bóng", "Hoa", "Tròn"],
  "Kệ Đèn":  ["Tất cả", "Gỗ", "LED"]
};

let allProducts = [];
let activeCategory = 'all';
let activeTabs = {};
const slideIdx = {};

async function fetchSheet() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    allProducts = parseCSV(text);
    renderAll();
  } catch(e) {
    document.getElementById('catalog').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:#c0392b">
        <div style="font-size:2.5rem;margin-bottom:12px">⚠️</div>
        <strong>Không tải được dữ liệu</strong><br>
        <span style="font-size:0.82rem;color:#888">Vui lòng thử lại sau</span>
      </div>`;
  }
}

// Chuẩn hóa tên cột: bỏ dấu tiếng Việt, uppercase, chỉ giữ chữ/số/gạch dưới
function normalizeHeader(h) {
  return h.trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // bỏ dấu
    .replace(/đ/gi,'d')
    .toUpperCase()
    .replace(/[^A-Z0-9_]/g,'_')
    .replace(/_+/g,'_')
    .replace(/^_|_$/g,'');
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const rawHeaders = parseCSVLine(lines[0]);
  // Lưu cả header gốc (normalized) lẫn map để tra
  const headers = rawHeaders.map(h => normalizeHeader(h));

  // Debug: log headers ra console để kiểm tra
  console.log('📋 Headers từ sheet:', headers);

  const products = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    if (vals.every(v => !v.trim())) continue;
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (vals[idx]||'').trim());
    if (!obj['TEN']) continue;

    // Đọc giá — hỗ trợ nhập tắt: 298 = 298.000đ
    let giaRaw = parseInt((obj['GIA']||'0').replace(/[^\d]/g,'')) || 0;
    if (giaRaw > 0 && giaRaw < 1000) giaRaw = giaRaw * 1000;

    // Đọc HOAT_DONG — tìm key chứa "HOAT" trong obj
    const hoatKey = Object.keys(obj).find(k => k.includes('HOAT')) || '';
    const hoatdong = hoatKey ? obj[hoatKey] : '';

    products.push({
      ten:       obj['TEN'] || '',
      danhmuc:   obj['DANH_MUC'] || '',
      kichthuoc: obj['KICH_THUOC'] || '',
      gia:       giaRaw,
      soluong:   parseInt(obj['SO_LUONG'])||0,
      masp:      obj['MA_SP'] || '',
      anh:       obj['ANH'] || '',
      hot:       obj['HOT']==='1'||obj['HOT']==='co'||obj['HOT']==='có',
      moi:       obj['MOI']==='1'||obj['MOI']==='co'||obj['MOI']==='có',
      kieu:      obj['KIEU'] || '',
      hoatdong:  hoatdong,
    });
  }
  console.log(`✅ Đọc được ${products.length} sản phẩm, ví dụ giá:`, products[0]?.gia);
  return products;
}

function parseCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c==='"') { inQ=!inQ; }
    else if (c===','&&!inQ) { result.push(cur); cur=''; }
    else { cur+=c; }
  }
  result.push(cur);
  return result;
}

function setCategory(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const pv = document.getElementById('priceFilter').value;

  // ✅ SỬA LỌC GIÁ: So sánh số nguyên với số nguyên, không qua format
  let pMin = 0, pMax = 99999999;
  if (pv !== 'all') {
    const parts = pv.split('-');
    pMin = parseInt(parts[0]);
    pMax = parseInt(parts[1]);
  }

  return allProducts.filter(p => {
    const mC = activeCategory === 'all' || p.danhmuc === activeCategory;
    const mQ = !q || p.ten.toLowerCase().includes(q) || p.masp.toLowerCase().includes(q) || p.danhmuc.toLowerCase().includes(q);
    // ✅ So sánh p.gia (số nguyên) với pMin/pMax (số nguyên) — đúng
    const mP = p.gia >= pMin && p.gia <= pMax;
    return mC && mQ && mP;
  });
}

function renderAll() {
  const filtered = getFiltered();
  const catalog = document.getElementById('catalog');

  filtered.sort((a,b) => {
    if (a.soluong===0 && b.soluong>0) return 1;
    if (a.soluong>0 && b.soluong===0) return -1;
    return 0;
  });

  document.getElementById('resultCount').textContent = filtered.length + ' sản phẩm';

  if (!filtered.length) {
    catalog.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--warm-gray)"><div style="font-size:3rem;margin-bottom:10px">🐱</div><strong>Không tìm thấy sản phẩm</strong></div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(p => {
    if (!grouped[p.danhmuc]) grouped[p.danhmuc] = [];
    grouped[p.danhmuc].push(p);
  });

  const catOrder = ['Mèo 1XX','Mèo 2XX','Mèo 3XX-4XX','Mèo 5XX','Trên 6XX','Kệ Đèn','Box Mica','Lẵng','Phụ Kiện'];
  const cats = catOrder.filter(c => grouped[c]);
  Object.keys(grouped).forEach(c => { if (!cats.includes(c)) cats.push(c); });

  let html = '';
  cats.forEach(cat => {
    const prods = grouped[cat];
    const emoji = cat.includes('Kệ') ? '🪔' : cat.includes('Box') ? '📦' : cat.includes('Phụ') ? '🎀' : '🐱';

    if (TAB_CATEGORIES[cat]) {
      const tabs = TAB_CATEGORIES[cat];
      if (!activeTabs[cat]) activeTabs[cat] = 'Tất cả';
      html += `<div class="tab-section">
        <div class="section-title">${emoji} ${cat}</div>
        <div class="tab-header">`;
      tabs.forEach(tab => {
        const active = activeTabs[cat]===tab ? 'active':'';
        html += `<button class="tab-btn ${active}" onclick="setTab('${cat}','${tab}')">${tab}</button>`;
      });
      html += `</div>`;
      tabs.forEach(tab => {
        const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().trim();
        const tabProds = tab==='Tất cả' ? prods : prods.filter(p => norm(p.kieu||'')===norm(tab));
        const activeClass = activeTabs[cat]===tab ? 'active':'';
        html += `<div class="tab-content ${activeClass}" id="tab-${cat.replace(/\s/g,'-')}-${tab}">
          <div class="products-grid">${tabProds.map(p => cardHTML(p)).join('')}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div style="margin-bottom:28px">
        <div class="section-title">${emoji} ${cat}</div>
        <div class="products-grid">${prods.map(p => cardHTML(p)).join('')}</div>
      </div>`;
    }
  });

  catalog.innerHTML = html;
}

function setTab(cat, tab) {
  activeTabs[cat] = tab;
  renderAll();
}

// ✅ SỬA: Format giá — lưu số nguyên đúng, hiển thị đẹp
function fmtGia(n) {
  // n là số nguyên đầy đủ (vd: 150000)
  return n.toLocaleString('vi-VN') + 'đ';
}

function cardHTML(p) {
  const oos = p.soluong === 0;
  const sc = oos ? 'out' : p.soluong <= 3 ? 'low' : 'plenty';
  const sl = oos ? 'Hết hàng' : 'Còn hàng';
  const giaHienThi = fmtGia(p.gia);

  let imgHTML = '';
  if (p.anh) {
    const imgs = p.anh.split(',').map(s=>s.trim()).filter(Boolean);
    if (imgs.length === 1) {
      imgHTML = `<div class="card-img-wrap">
        <div class="slides-track"><div class="slide">
          <img src="${IMG_BASE}${imgs[0]}" alt="${p.ten}" onerror="this.parentNode.innerHTML='<div class=\\'slide-placeholder\\'>🐱</div>'">
        </div></div>
      </div>`;
    } else {
      const id = p.masp || Math.random().toString(36).slice(2);
      const slides = imgs.map(img=>`<div class="slide"><img src="${IMG_BASE}${img}" alt="${p.ten}" onerror="this.parentNode.innerHTML='<div class=\\'slide-placeholder\\'>🐱</div>'"></div>`).join('');
      const dots = imgs.map((_,i)=>`<div class="dot${i===0?' active':''}"></div>`).join('');
      imgHTML = `<div class="card-img-wrap">
        <div class="slides-track" id="st-${id}">${slides}</div>
        <button class="slider-btn prev" onclick="slide('${id}',${imgs.length},-1)">‹</button>
        <button class="slider-btn next" onclick="slide('${id}',${imgs.length},1)">›</button>
        <div class="slider-dots" id="dots-${id}">${dots}</div>
      </div>`;
    }
  } else {
    const emoji = p.danhmuc.includes('Kệ') ? '🪔' : p.danhmuc.includes('Box') ? '📦' : p.danhmuc.includes('Phụ') ? '🎀' : '🐱';
    imgHTML = `<div class="card-img-wrap"><div class="slide-placeholder">${emoji}</div></div>`;
  }

  const msgText = `Xin Chào! Tôi muốn đặt:\n🐱 ${p.ten}\n📐 ${p.kichthuoc}\n💰 ${giaHienThi}\nMã: ${p.masp}\nShop còn hàng không ạ?`;
  const msgEnc = encodeURIComponent(msgText);

  return `<div class="card${oos?' out-of-stock':''}">
    <div class="card-badge-wrap">
      ${p.hot ? '<span class="badge badge-hot">🔥 Hot</span>' : ''}
      ${p.moi ? '<span class="badge badge-new">✨ Mới</span>' : ''}
      ${p.kieu ? `<span class="badge badge-kieu">${p.kieu}</span>` : ''}
      ${p.hoatdong ? `<span class="badge badge-hoatdong">⚡ ${p.hoatdong}</span>` : ''}
      ${oos ? '<span class="badge badge-soldout">Hết hàng</span>' : ''}
    </div>
    ${imgHTML}
    <div class="card-body">
      <div class="card-name">${p.ten}</div>
      <div class="card-size">📐 ${p.kichthuoc}</div>
      ${p.masp ? `<div class="card-masp">Mã: ${p.masp}</div>` : ''}
    </div>
    <div class="card-footer">
      <div class="card-price">${giaHienThi}<span class="unit"> /con</span></div>
      <div class="stock-info">
        <span class="stock-count ${sc}">${sl}</span>
      </div>
    </div>
    <div class="btn-wrap">
      ${oos
        ? `<button class="btn-copy" disabled>⚠️ Hết hàng</button>`
        : `<button class="btn-copy" onclick="copyInfo(${JSON.stringify(p.ten)},${JSON.stringify(p.kichthuoc)},${JSON.stringify(giaHienThi)},${JSON.stringify(p.masp)})">📋 Copy thông tin đặt hàng</button>
           <a href="https://m.me/61555618073597" target="_blank" class="btn-zalo" style="background:#0084ff">💬 Nhắn Fanpage</a>`
      }
    </div>
  </div>`;
}

function slide(id, total, dir) {
  slideIdx[id] = ((slideIdx[id]||0) + dir + total) % total;
  const el = document.getElementById('st-' + id);
  if (el) el.style.transform = `translateX(-${slideIdx[id]*100}%)`;
  document.querySelectorAll(`#dots-${id} .dot`).forEach((d,i) => d.classList.toggle('active', i===slideIdx[id]));
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function copyInfo(ten, size, gia, masp) {
  const text = `Xin Chào! Tôi muốn đặt:\n🐱 ${ten}\n📐 ${size}\n💰 ${gia}\nMã: ${masp}\nShop còn hàng không ạ?`;
  navigator.clipboard.writeText(text)
    .then(() => showToast('✅ Đã copy! Mở Zalo dán vào gửi shop nhé'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('✅ Đã copy! Mở Zalo dán vào gửi shop nhé');
    });
}

fetchSheet();
